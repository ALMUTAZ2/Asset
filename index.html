    <script>
      (function () {
        try {
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (desc && desc.get && !desc.set && desc.configurable) {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: desc.enumerable,
              get: desc.get,
              set: function () {
                // Ignore read-only window.fetch overwrite attempts from browser extensions
              },
            });
          }
        } catch (_) {}
        window.addEventListener(
          'error',
          function (ev) {
            var src = (ev && ev.filename) || '';
            var stack = (ev && ev.error && ev.error.stack) || '';
            if (
              src.indexOf('chrome-extension://') === 0 ||
              src.indexOf('moz-extension://') === 0 ||
              stack.indexOf('chrome-extension://') !== -1
            ) {
              ev.preventDefault();
              ev.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
