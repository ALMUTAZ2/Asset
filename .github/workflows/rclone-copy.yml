name: Move AssetJazan from Dropbox to OneDrive

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

jobs:
  move-assetjazan:
    runs-on: ubuntu-latest
    steps:
      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Create rclone.conf from Secret
        env:
          RCLONE_CONF_CONTENT: ${{ secrets.RCLONE_CONF_CONTENT }}
        run: |
          mkdir -p ~/.config/rclone
          printf "%s\n" "$RCLONE_CONF_CONTENT" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Move dropbox:/esf to onedrive:/Asset Flow
        run: |
          SRC="dropbox:/esf"
          DST="onedrive:/Asset Flow"
          rclone mkdir "$DST"
          rclone move "$SRC" "$DST" \
            --create-empty-src-dirs \
            --transfers 4 \
            --checkers 8 \
            --retries 3 \
            --log-level INFO
